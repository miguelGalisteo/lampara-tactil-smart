# Opción A: control de la lámpara táctil mediante un relé intercalado
# en el cable de alimentación (aislado de la red, ver docs/wiring.md).
#
# Hardware de referencia: ESP8266 (Wemos D1 mini) + módulo relé de 1 canal
# con opto-acoplador. Si usas un Sonoff Mini/Shelly 1 ya fabricado, cambia
# la sección `esp8266`/`esp32` y el pin del relé por los de tu placa
# (consulta la ficha de tu dispositivo en esphome.io/devices).

substitutions:
  nombre: "lampara-tactil"
  nombre_amigable: "Lámpara Táctil"
  # Nº de pulsos apagado/encendido para pasar de un modo al siguiente.
  # Pruébalo a mano primero (ver docs/comportamiento-lampara.md) y ajusta.
  pulso_off_ms: "400ms"
  pulso_on_ms: "600ms"

esphome:
  name: ${nombre}
  friendly_name: ${nombre_amigable}

esp8266:
  board: d1_mini

# Credenciales en esphome/secrets.yaml (copia secrets.yaml.example)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${nombre_amigable} Fallback"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

switch:
  - platform: gpio
    pin: D1
    id: rele_lampara
    name: "${nombre_amigable}"
    # Al arrancar/perder corriente el relé se queda apagado, así el
    # microcontrolador nunca "decide" encender la lámpara sin que se lo pidas.
    restore_mode: ALWAYS_OFF

script:
  - id: siguiente_modo
    mode: single
    then:
      - switch.turn_off: rele_lampara
      - delay: ${pulso_off_ms}
      - switch.turn_on: rele_lampara
      - delay: ${pulso_on_ms}

button:
  - platform: template
    name: "${nombre_amigable} - Siguiente modo"
    on_press:
      - script.execute: siguiente_modo
